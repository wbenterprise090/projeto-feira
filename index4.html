<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processando... | IA Maria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --azul: #1e3a8a; --azul-claro: #3b82f6; --escuro: #0f172a; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter';
  background: linear-gradient(135deg, var(--escuro) 0%, #1e293b 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

.container {
  text-align: center;
  max-width: 400px;
  padding: 30px;
}

/* Círculo girando */
.spinner {
  width: 80px;
  height: 80px;
  margin: 0 auto 30px;
  border: 4px solid rgba(59, 130, 246, 0.2);
  border-top: 4px solid var(--azul-claro);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
}

/* Ondas de pulso */
.pulse {
  width: 100px;
  height: 100px;
  background: rgba(59, 130, 246, 0.2);
  border-radius: 50%;
  margin: -90px auto 30px;
  animation: pulse 2s ease-out infinite;
}

@keyframes pulse {
 0% { transform: scale(0.8); opacity: 0.8; }
 50% { transform: scale(1.2); opacity: 0.4; }
 100% { transform: scale(0.8); opacity: 0.8; }
}

h1 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #fff, var(--azul-claro));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sub {
  font-size: 15px;
  color: #cbd5e1;
  margin-bottom: 35px;
  line-height: 1.6;
}

/* Passos que aparecem um por um */
.steps {
  text-align: left;
  max-width: 300px;
  margin: 0 auto;
}

.step {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
  opacity: 0;
  animation: fadeInStep 0.5s forwards;
}

.step:nth-child(1) { animation-delay: 0.5s; }
.step:nth-child(2) { animation-delay: 1.5s; }
.step:nth-child(3) { animation-delay: 2.5s; }
.step:nth-child(4) { animation-delay: 3.5s; }

@keyframes fadeInStep {
  to { opacity: 1; }
}

.step i {
  width: 24px;
  height: 24px;
  background: var(--azul);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.step span {
  font-size: 14px;
  color: #e2e8f0;
}

.step.done i {
  background: #10b981;
}

/* Pontinhos animados */
.dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
 0%, 20% { content: ''; }
 40% { content: '.'; }
 60% { content: '..'; }
 80%, 100% { content: '...'; }
}
</style>
</head>
<body>
<div class="container">
  <div class="pulse"></div>
  <div class="spinner"></div>

  <h1>IA Maria está analisando<span class="dots"></span></h1>
  <p class="sub">Processando teu perfil com algoritmos de inteligência artificial</p>

  <div class="steps">
    <div class="step" id="step1">
      <i class="fas fa-check"></i>
      <span>Analisando notas acadêmicas</span>
    </div>
    <div class="step" id="step2">
      <i class="fas fa-check"></i>
      <span>Processando respostas do teste</span>
    </div>
    <div class="step" id="step3">
      <i class="fas fa-check"></i>
      <span>Cruzando com base de dados</span>
    </div>
    <div class="step" id="step4">
      <i class="fas fa-check"></i>
      <span>Gerando relatório personalizado</span>
    </div>
  </div>
</div>

<script>
// Simula o tempo de processamento e marca os steps como feitos
let stepAtual = 0;
const steps = ['step1', 'step2', 'step3', 'step4'];

const intervalo = setInterval(() => {
  if (stepAtual < steps.length) {
    document.getElementById(steps[stepAtual]).classList.add('done');
    stepAtual++;
  } else {
    clearInterval(intervalo);
  }
}, 1000);

// Redireciona pra página de resultado após 4.5 segundos
setTimeout(() => {
  window.location.href = 'index5.html';
}, 4500);
</script>
</body>
</html>
