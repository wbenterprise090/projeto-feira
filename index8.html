<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Configurações | IA Maria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --azul: #1e3a8a; --escuro: #0f172a; }
body { font-family: 'Inter'; background: var(--escuro); padding: 20px; }
.card { background: white; border-radius: 15px; padding: 35px 30px; max-width: 650px; margin: 0 auto; }
h1 { color: var(--azul); font-size: 26px; font-weight: 800; margin-bottom: 30px; }
.config-item { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #e2e8f0; }
.config-item:last-child { border: none; padding-bottom: 0; }
label { display: block; font-weight: 700; color: var(--azul); margin-bottom: 8px; font-size: 14px; }
input, select { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
small { color: #64748b; font-size: 12px; margin-top: 5px; display: block; }
.toggle { display: flex; align-items: center; gap: 12px; }
.switch { position: relative; width: 50px; height: 26px; background: #cbd5e1; border-radius: 13px; cursor: pointer; }
.switch input { display: none; }
.switch span { position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
.switch input:checked + span { left: 26px; background: var(--azul); }
.btn { padding: 15px 30px; background: var(--azul); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 20px; }
.sucesso { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1><i class="fas fa-cog"></i> Configurações do Sistema</h1>
  <div class="sucesso" id="sucesso">Configurações salvas com sucesso!</div>
  
  <div class="config-item">
    <label>Nome do Instituto</label>
    <input type="text" id="nomeInstituto" value="Instituto Politécnico Prof. Maria Osvalda">
  </div>
  
  <div class="config-item">
    <label>Temperatura da IA Gemini</label>
    <input type="range" min="0" max="1" step="0.1" value="0.3" id="temperatura">
    <small>0 = Respostas conservadoras | 1 = Respostas criativas</small>
  </div>
  
  <div class="config-item">
    <label>Modo Escuro Automático</label>
    <div class="toggle">
      <div class="switch"><input type="checkbox" id="darkMode"><span></span></div>
      <span style="color: #1e293b; font-size: 14px;">Ativar tema escuro</span>
    </div>
  </div>
  
  <div class="config-item">
    <label>Exibir Informações Salariais</label>
    <div class="toggle">
      <div class="switch"><input type="checkbox" id="mostrarSalario" checked><span></span></div>
      <span style="color: #1e293b; font-size: 14px;">Mostrar salários no relatório</span>
    </div>
  </div>
  
  <button class="btn" onclick="salvar()">Salvar Configurações</button>
</div>
<script>
const config = JSON.parse(localStorage.getItem('configSistema') || '{}');
if (config.nomeInstituto) nomeInstituto.value = config.nomeInstituto;
if (config.temperatura) temperatura.value = config.temperatura;
if (config.darkMode) darkMode.checked = config.darkMode;
if (config.mostrarSalario !== undefined) mostrarSalario.checked = config.mostrarSalario;

function salvar() {
  const config = {
    nomeInstituto: nomeInstituto.value,
    temperatura: parseFloat(temperatura.value),
    darkMode: darkMode.checked,
    mostrarSalario: mostrarSalario.checked
  };
  localStorage.setItem('configSistema', JSON.stringify(config));
  sucesso.style.display = 'block';
  setTimeout(() => sucesso.style.display = 'none', 3000);
}
</script>
</body>
</html>
