<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Painel Administrativo | IA Maria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --azul: #1e3a8a; --escuro: #0f172a; }
body { font-family: 'Inter'; background: var(--escuro); color: #e2e8f0; padding: 20px; }
.card { background: white; border-radius: 15px; padding: 30px; max-width: 1000px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
h1 { color: var(--azul); font-size: 26px; font-weight: 800; }
.btn-sair { padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
.stat-card { background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; border-left: 4px solid var(--azul); }
.stat-card h3 { font-size: 36px; color: var(--azul); font-weight: 800; }
.stat-card p { font-size: 13px; color: #64748b; margin-top: 5px; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--azul); color: white; padding: 14px; text-align: left; font-weight: 600; font-size: 13px; }
td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; color: #1e293b; font-size: 14px; }
tr:hover { background: #f8fafc; }
.loading { text-align: center; padding: 40px; color: var(--azul); }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1><i class="fas fa-tachometer-alt"></i> Painel Administrativo</h1>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><h3 id="total">0</h3><p>Testes Realizados</p></div>
    <div class="stat-card"><h3 id="media">0%</h3><p>Média Compatibilidade</p></div>
    <div class="stat-card"><h3 id="topArea">-</h3><p>Área Mais Escolhida</p></div>
    <div class="stat-card"><h3 id="hoje">0</h3><p>Testes Hoje</p></div>
  </div>
  <h3 style="color: var(--azul); margin-bottom: 15px; font-size: 18px;">Últimos 50 Testes</h3>
  <div id="tabela"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando dados...</div></div>
</div>
<script>
if (!localStorage.getItem('adminLogado')) window.location.href = '/login.html';

function sair() {
  localStorage.removeItem('adminLogado');
  window.location.href = '/index.html';
}

async function carregar() {
  try {
    const res = await fetch('/api/admin/dados', {
      headers: { 'authorization': 'Bearer admin123' }
    });
    const data = await res.json();
    
    document.getElementById('total').textContent = data.total;
    const media = data.testes.length ? Math.round(data.testes.reduce((a,b)=>a+b.compat||0,0)/data.testes.length) : 0;
    document.getElementById('media').textContent = media + '%';
    
    const areas = data.testes.map(t => t.topArea);
    const top = areas.sort((a,b) => areas.filter(v=>v===a).length - areas.filter(v=>v===b).length).pop();
    document.getElementById('topArea').textContent = top || '-';
    
    const hoje = data.testes.filter(t => new Date(t.data).toDateString() === new Date().toDateString()).length;
    document.getElementById('hoje').textContent = hoje;
    
    let html = '<table><thead><tr><th>Nome</th><th>Transição</th><th>Top Área</th><th>Compat</th><th>Data</th></tr></thead><tbody>';
    data.testes.forEach(t => {
      html += `<tr><td>${t.nome}</td><td>${t.transicao}</td><td>${t.topArea}</td><td>${t.compat}%</td><td>${new Date(t.data).toLocaleDateString('pt-PT')}</td></tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tabela').innerHTML = html;
  } catch(e) {
    document.getElementById('tabela').innerHTML = '<p style="color:red">Erro ao carregar dados</p>';
  }
}
carregar();
</script>
</body>
</html>
